name: Prepare MotionLoom 2.6.1 metadata

on:
  push:
    branches:
      - release/2.6.1-frame-generation-lock

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.6.1-frame-generation-lock
          fetch-depth: 0

      - name: Prepare release metadata
        run: python3 scripts/prepare-release-2.6.1.py

      - name: Commit deterministic release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare MotionLoom 2.6.1"
          git push origin HEAD:release/2.6.1-frame-generation-lock
