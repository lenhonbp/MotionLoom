name: Animation Quality Gate

on:
  pull_request:
    paths:
      - "src/output/**"
      - "src/core/**"
      - "scripts/**"
      - "schemas/**"
      - "references/**"
      - "SKILL.md"
      - "agent-card.json"
      - "artifacts/**"
      - "templates/**"
      - "assets/library/**"
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime and Dev Lab dependencies
        run: |
          npm install
          cd dev-lab
          npm install
          npx playwright install --with-deps chromium

      - name: Run engine tests
        run: python3 tests/scripts/run_tests.py

      - name: Validate Skill package and metadata
        run: python3 scripts/skill-doctor.py --json

      - name: Resolve changed scenes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" \
              | grep '^src/output/[^/]*' | cut -d/ -f3 | sort -u > /tmp/changed-scenes || true
          else
            git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" \
              | grep '^src/output/[^/]*' | cut -d/ -f3 | sort -u > /tmp/changed-scenes || true
          fi
          cat /tmp/changed-scenes

      - name: Require task report and handoff for changed scenes
        if: ${{ hashFiles('src/output/**') != '' }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          scenes = [line.strip() for line in Path('/tmp/changed-scenes').read_text().splitlines() if line.strip()]
          if not scenes:
              print('No changed scenes; report completeness check skipped.')
              raise SystemExit(0)
          root = Path('artifacts')
          missing = []
          for scene in scenes:
              matched = []
              for task_path in root.glob('*/task.json') if root.is_dir() else []:
                  try:
                      task = json.loads(task_path.read_text())
                  except Exception:
                      continue
                  if task.get('scene') == scene:
                      matched.append(task_path.parent)
              if not matched:
                  missing.append(f'{scene}: no artifacts/<task-id>/task.json bound to scene')
                  continue
              if not any(all((task_dir / name).is_file() for name in ('execution-report.json', 'artifact-manifest.json', 'handoff.json')) for task_dir in matched):
                  missing.append(f'{scene}: incomplete execution-report/artifact-manifest/handoff bundle')
                  continue
              if not any(subprocess.run(
                  ['python3', 'scripts/report.py', 'check', '--task-dir', str(task_dir)],
                  capture_output=True,
              ).returncode == 0 for task_dir in matched):
                  missing.append(f'{scene}: semantic report check failed')
          if missing:
              print('FAIL: report/handoff contract is incomplete:')
              print('\n'.join(f' - {item}' for item in missing))
              sys.exit(1)
          print(f'Report contract passed for {len(scenes)} scene(s).')
          PY

      - name: Prepare Dev Lab scene artifacts
        run: |
          while read -r scene; do
            [ -z "$scene" ] && continue
            bash scripts/devlab.sh "$scene" --prepare-only
          done < /tmp/changed-scenes

      - name: Boot Dev Lab HTTP server
        run: |
          python3 -m http.server 3300 --directory dev-lab/public >/tmp/devlab.log 2>&1 &
          echo $! >/tmp/devlab.pid

      - name: Render runtime snapshot frames for changed scenes
        env:
          LAB_URL: http://localhost:3300
        run: |
          while read -r scene; do
            [ -z "$scene" ] && continue
            bash scripts/render.sh "$scene"
          done < /tmp/changed-scenes

      - name: Enforce context-bound quality gate
        run: |
          if [ ! -f project-context.json ]; then
            if [ -s /tmp/changed-scenes ]; then
              echo "FAIL: changed scenes require project-context.json at repository root"
              exit 1
            fi
            echo "No scene outputs changed; context-bound scene gate is skipped."
            exit 0
          fi
          python3 scripts/quality-gate.py --all --context project-context.json
