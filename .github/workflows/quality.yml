name: MotionLoom Quality

on:
  pull_request:
    paths:
      - "src/output/**"
      - "src/core/**"
      - "scripts/**"
      - "schemas/**"
      - "references/**"
      - "requirements.txt"
      - "tests/**"
      - "package.json"
      - "SKILL.md"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "LICENSE"
      - ".github/**"
      - "docs/**"
      - "agent-card.json"
      - "agent-surfaces.json"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - "AGENTS.md"
      - "examples/**"
      - "tests/fixtures/**"
      - "artifacts/**"
      - "templates/**"
      - "assets/library/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-memory:
    name: Project Memory / CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Project Memory recovery contract
        run: python tests/scripts/test_project_memory.py

      - name: Check cross-platform CLI routing
        run: node bin/motionloom.mjs --help

      - name: Check Agent discovery and installation matrix
        run: |
          python tests/scripts/test_discovery.py
          python tests/scripts/test_consumer_fixtures.py
          python tests/scripts/test_installation_matrix.py
          node bin/motionloom.mjs discovery check --root . --json

      - name: Inspect npm tarball
        run: npm pack --dry-run --access public

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python verification dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install runtime and Dev Lab dependencies
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium
          cd dev-lab
          pnpm install --frozen-lockfile

      - name: Run engine tests
        run: python3 tests/scripts/run_tests.py

      - name: Run Intelligence Core adversarial evals
        run: python3 scripts/eval-intelligence.py

      - name: Run browser runtime adapter evidence
        run: npm run runtime:test

      - name: Validate Skill package and metadata
        run: python3 scripts/skill-doctor.py --json

      - name: Validate Intelligence Core registry
        run: |
          python3 scripts/intelligence.py capabilities build --output /tmp/capability-registry.json
          python3 scripts/intelligence.py capabilities validate --path /tmp/capability-registry.json

      - name: Resolve changed scenes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" \
              | grep '^src/output/[^/]*' | cut -d/ -f3 | sort -u > /tmp/changed-scenes || true
          else
            git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" \
              | grep '^src/output/[^/]*' | cut -d/ -f3 | sort -u > /tmp/changed-scenes || true
          fi
          cat /tmp/changed-scenes

      - name: Capture and verify runtime telemetry for changed scenes
        run: |
          if [ ! -s /tmp/changed-scenes ]; then
            echo "No changed scenes; runtime telemetry capture is skipped."
            exit 0
          fi
          while read -r scene; do
            [ -z "$scene" ] && continue
            bash scripts/capture-runtime-telemetry.sh "$scene" "artifacts/${scene}-task"
          done < /tmp/changed-scenes

      - name: Generate semantic lint benchmarks for changed scenes
        run: |
          if [ ! -s /tmp/changed-scenes ]; then
            echo "No changed scenes; semantic lint benchmark generation is skipped."
            exit 0
          fi
          while read -r scene; do
            [ -z "$scene" ] && continue
            task_dir="artifacts/${scene}-task"
            if [ ! -f "$task_dir/task.json" ]; then
              echo "FAIL: no task bundle found for changed scene: $scene"
              exit 1
            fi
            python3 scripts/intelligence.py semantic-lint benchmark --task-dir "$task_dir" \
              --iterations 25 --threshold-ms 500 --output "$task_dir/semantic-lint-benchmark.json"
          done < /tmp/changed-scenes

      - name: Refresh task artifact manifest and handoff
        run: |
          while read -r scene; do
            [ -z "$scene" ] && continue
            python3 scripts/report.py collect --task-dir "artifacts/${scene}-task"
          done < /tmp/changed-scenes

      - name: Build and verify signed attestations for changed scenes
        run: |
          if [ ! -s /tmp/changed-scenes ]; then
            echo "No changed scenes; signed attestation generation is skipped."
            exit 0
          fi
          python3 scripts/attestation-keygen.py \
            --private-key /tmp/motionloom-ci-attestation.key \
            --policy /tmp/motionloom-ci-policy.json \
            --key-id "ci-ephemeral-${GITHUB_RUN_ID}"
          while read -r scene; do
            [ -z "$scene" ] && continue
            task_dir="artifacts/${scene}-task"
            if [ -f project-context.json ]; then
              context="project-context.json"
            else
              context="$task_dir/project-context.json"
            fi
            python3 scripts/attestation.py statement \
              --scene-dir "src/output/$scene" \
              --task-dir "$task_dir" \
              --context "$context" \
              --output "$task_dir/attestation-statement.json"
            python3 scripts/attestation.py build \
              --statement "$task_dir/attestation-statement.json" \
              --private-key /tmp/motionloom-ci-attestation.key \
              --key-id "ci-ephemeral-${GITHUB_RUN_ID}" \
              --output "$task_dir/attestation.json"
            cp /tmp/motionloom-ci-policy.json "$task_dir/trust-policy.json"
            task_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["task_id"])' "$task_dir/task.json")
            python3 scripts/attestation-verifier.py \
              --attestation "$task_dir/attestation.json" \
              --trust-policy "$task_dir/trust-policy.json" \
              --expected-task-id "$task_id" \
              --expected-scene "$scene" \
              --output "$task_dir/attestation-verifier-report.json"
          done < /tmp/changed-scenes

      - name: Require task report and handoff for changed scenes
        run: |
          if [ ! -s /tmp/changed-scenes ]; then
            echo "No changed scenes; report contract is skipped."
            exit 0
          fi
          python3 scripts/report-contract.py --scenes-file /tmp/changed-scenes --require-attestation

      - name: Prepare Dev Lab scene artifacts
        run: |
          while read -r scene; do
            [ -z "$scene" ] && continue
            bash scripts/devlab.sh "$scene" --prepare-only
          done < /tmp/changed-scenes

      - name: Boot Dev Lab HTTP server
        run: |
          python3 -m http.server 3300 --directory dev-lab/public >/tmp/devlab.log 2>&1 &
          echo $! >/tmp/devlab.pid

      - name: Render runtime snapshot frames for changed scenes
        env:
          LAB_URL: http://localhost:3300
        run: |
          while read -r scene; do
            [ -z "$scene" ] && continue
            bash scripts/render.sh "$scene"
          done < /tmp/changed-scenes

      - name: Enforce context-bound quality gate
        run: |
          if [ ! -s /tmp/changed-scenes ]; then
            echo "No scene outputs changed; context-bound scene gate is skipped."
            exit 0
          fi
          while read -r scene; do
            [ -z "$scene" ] && continue
            if [ -f project-context.json ]; then
              context="project-context.json"
            elif [ -f "artifacts/${scene}-task/project-context.json" ]; then
              context="artifacts/${scene}-task/project-context.json"
            else
              echo "FAIL: no project context found for changed scene: $scene"
              exit 1
            fi
            task_dir="artifacts/${scene}-task"
            if [ ! -f "$task_dir/task.json" ]; then
              echo "FAIL: no task bundle found for changed scene: $scene"
              exit 1
            fi
            python3 scripts/quality-gate.py --scene "$scene" --context "$context" \
              --task-dir "$task_dir" --require-browser-review --require-intelligence --require-p1 --require-benchmark --require-telemetry --require-attestation --require-visual-truth
          done < /tmp/changed-scenes

  project-corpus:
    name: Project corpus evidence posture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate labeled corpus without fetching external projects
        run: |
          mkdir -p artifacts
          python3 scripts/eval-projects.py \
            --workspace . \
            --allow-insufficient \
            --output artifacts/project-corpus-report.json

      - name: Upload corpus evidence posture
        uses: actions/upload-artifact@v4
        with:
          name: project-corpus-evidence-${{ github.run_id }}
          path: artifacts/project-corpus-report.json
          if-no-files-found: error
          retention-days: 14
