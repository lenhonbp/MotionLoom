name: Release MotionLoom npm package

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      release_version:
        description: package version to verify and publish
        required: true
        default: 2.6.1
        type: string
      create_github_release:
        description: Create a GitHub release after npm publication
        required: true
        default: true
        type: boolean
  push:
    branches:
      - release/publish-2.6.1

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish npm package
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/publish-2.6.1'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set up npm trusted publishing client
        run: npm install --global npm@11.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python runtime dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Validate docs and package metadata
        run: pnpm run docs:check

      - name: Validate Skill package
        run: python3 scripts/skill-doctor.py --json

      - name: Run release regression
        run: python3 tests/scripts/run_tests.py

      - name: Test the installed package from a consumer project
        run: pnpm run package:smoke

      - name: Verify release traceability
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '2.6.1' || inputs.release_version }}
          NPM_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.npm_tag }}
        run: |
          python3 scripts/release-verify.py \
            --expected-version "$RELEASE_VERSION" \
            --release-note "docs/releases/$RELEASE_VERSION.md"
          echo "Publishing motionloom@$RELEASE_VERSION with npm distribution tag $NPM_TAG"

      - name: Publish to npm
        env:
          NPM_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Create GitHub release
        if: github.event_name == 'push' || inputs.create_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" --title "MotionLoom $version" --generate-notes
